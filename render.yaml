# One-click deploy for Render (https://render.com) on the free plan.
#
# The member data lives in a free Neon Postgres database, not on this server's
# disk, so nothing is lost when Render restarts or redeploys the free instance.
#
# Before deploying: create a free project at https://neon.tech and have its
# pooled connection string ready — Render asks for DATABASE_URL during setup.
services:
  - type: web
    name: oba-youth-abuja
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Paste the Neon pooled connection string when Render prompts for this.
      - key: DATABASE_URL
        sync: false
      # Your email, so you stay an administrator after any redeploy.
      - key: ADMIN_EMAIL
        sync: false
