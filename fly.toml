# Deploy config for Fly.io (https://fly.io), as an alternative to Render.
# Member data lives in Neon Postgres, so no volume is needed here.
#   fly launch --no-deploy
#   fly secrets set DATABASE_URL="postgresql://..." \
#                   SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
#   fly deploy
app = "oba-youth-abuja"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
