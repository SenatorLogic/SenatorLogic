# Deploy config for Fly.io (https://fly.io).
# Set the app name to something unique, then:
#   fly launch --no-deploy
#   fly volumes create oba_data --size 1
#   fly secrets set SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
#   fly deploy
app = "oba-youth-abuja"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_FILE = "/data/oba.db"

[[mounts]]
  source = "oba_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
